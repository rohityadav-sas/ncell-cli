<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ncell CLI. Your Ncell account, one command away. Rust, Windows, macOS and Linux.">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160b2c"/><stop offset=".55" stop-color="#35115f"/><stop offset="1" stop-color="#771d68"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a855f7" stop-opacity=".4"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="920" cy="80" r="290" fill="url(#glow)"/>
  <g fill="none" stroke="#d8b4fe" opacity=".12"><circle cx="1050" cy="40" r="110"/><circle cx="1050" cy="40" r="160"/><circle cx="1050" cy="40" r="210"/></g>
  <text x="62" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="60" font-weight="700" fill="white">ncell<tspan fill="#d8b4fe">-cli</tspan></text>
  <text x="62" y="186" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#f3e8ff">Your Ncell account, one command away.</text>
  <text x="63" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2" fill="#d8b4fe">BUILT WITH RUST  /  WINDOWS · macOS · LINUX</text>
  <g transform="translate(710 115)">
    <rect width="415" height="136" rx="15" fill="#130a24" stroke="#c084fc" stroke-opacity=".3"/>
    <g transform="translate(20 20)"><circle r="4" fill="#fb7185"/><circle cx="16" r="4" fill="#fbbf24"/><circle cx="32" r="4" fill="#4ade80"/></g>
    <text x="22" y="65" font-family="Consolas,monospace" font-size="17" fill="#e9d5ff"><tspan fill="#f472b6">❯ </tspan>ncell plans --sort price</text>
    <rect x="367" y="52" width="8" height="17" fill="#c084fc"></rect>
  </g>
  <path d="M0 293Q200 252 400 299T800 297T1200 281V360H0Z" fill="#a855f7" opacity=".16"></path>

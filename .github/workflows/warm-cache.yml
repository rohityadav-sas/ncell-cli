name: Warm release cache
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - .cargo/**
      - .github/actions/build-release/**
      - .github/workflows/warm-cache.yml
      - .github/workflows/release.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warm:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-release
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: "true"

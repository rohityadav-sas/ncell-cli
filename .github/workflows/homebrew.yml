name: Homebrew package
on:
  push:
    branches: [main]
    paths: ['Formula/**', '.github/workflows/homebrew.yml']
  workflow_dispatch:
jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install and test formula
        run: |
          brew tap rohityadav-sas/ncell-cli "$GITHUB_WORKSPACE"
          brew install --build-from-source rohityadav-sas/ncell-cli/ncell-cli
          brew test rohityadav-sas/ncell-cli/ncell-cli
  windows-archive:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download and test published ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = (gh release view --repo rohityadav-sas/ncell-cli --json tagName --jq .tagName)
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Could not resolve latest release' }
          $expected = $tag.TrimStart('v')
          gh release download $tag --repo rohityadav-sas/ncell-cli --pattern '*windows-x86_64.zip' --dir smoke
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $manifest = Get-Content -Raw bucket/ncell-cli.json | ConvertFrom-Json
          $zip = Get-ChildItem smoke -Filter *.zip | Select-Object -First 1
          if ($manifest.version -eq $expected) {
            $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
            if ($hash -ne $manifest.architecture.'64bit'.hash) { throw 'Release checksum mismatch' }
          } else {
            Write-Warning "Bucket manifest is $($manifest.version); skipping hash check for $tag"
          }
          Expand-Archive $zip.FullName -DestinationPath smoke/extracted
          if (-not (Test-Path smoke/extracted/LICENSE)) { throw 'MIT license missing' }
          $version = & ./smoke/extracted/ncell.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "ncell-cli $expected") { throw 'Version check failed' }
          & ./smoke/extracted/ncell.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help check failed' }

name: Release binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      source-ref:
        description: Source commit override for an existing release
        required: false
      full:
        description: Run publish too (only for real releases, never for rebuilds)
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            binary: ncell.exe
          - os: windows-11-arm
            platform: windows-arm64
            binary: ncell.exe
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: ncell
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            binary: ncell
          - os: macos-15-intel
            platform: macos-x86_64
            binary: ncell
          - os: macos-15
            platform: macos-arm64
            binary: ncell
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || env.TAG }}
      - uses: ./.github/actions/build-release
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: "false"
      - name: Check executable
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "v$version"
          test "$(target/release/${{ matrix.binary }} --version)" = "ncell-cli $version"
          target/release/${{ matrix.binary }} --help
      - name: Package ZIP
        shell: python
        run: |
          import os, zipfile
          from pathlib import Path
          name = f"ncell-cli-{os.environ['TAG']}-${{ matrix.platform }}.zip"
          with zipfile.ZipFile(name, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write('target/release/${{ matrix.binary }}', '${{ matrix.binary }}')
              archive.write('LICENSE', 'LICENSE')
              for path in sorted(Path('docs').rglob('*')):
                  if path.is_file():
                      archive.write(path.as_posix(), path.as_posix())
      - name: Publish archive
        shell: bash
        run: |
          asset="ncell-cli-${TAG}-${{ matrix.platform }}.zip"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          fi
  publish-crates:
    # Upload the release to crates.io right after the binaries build.
    # Versions already on the registry are skipped, and a dry run passes
    # before the real upload, so re-running is always safe.
    # Manual rebuild dispatches are excluded without full=true.
    needs: [build]
    if: github.event_name == 'release' || (inputs.full == 'true' && inputs.source-ref == '')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Require the publish token
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Add a crates.io token to the repository Actions secrets."
            exit 1
          fi
      - name: Skip versions already on crates.io
        id: check
        run: |
          version="${TAG#v}"
          if curl -fsSL --max-time 30 "https://crates.io/api/v1/crates/ncell-cli/${version}/download" -o /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io
        if: steps.check.outputs.published != 'true'
        # The dry run already compiled and verified the package, so the real
        # upload skips a second identical verification build.
        run: cargo publish --locked --dry-run && cargo publish --locked --no-verify

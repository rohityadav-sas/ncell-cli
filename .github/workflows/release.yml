name: Release binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      source-ref:
        description: Source commit override for an existing release
        required: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            binary: ncell.exe
          - os: windows-11-arm
            platform: windows-arm64
            binary: ncell.exe
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: ncell
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            binary: ncell
          - os: macos-15-intel
            platform: macos-x86_64
            binary: ncell
          - os: macos-15
            platform: macos-arm64
            binary: ncell
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Check executable
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "v$version"
          test "$(target/release/${{ matrix.binary }} --version)" = "ncell-cli $version"
          target/release/${{ matrix.binary }} --help
      - name: Package ZIP
        shell: python
        run: |
          import os, zipfile
          from pathlib import Path
          name = f"ncell-cli-{os.environ['TAG']}-${{ matrix.platform }}.zip"
          with zipfile.ZipFile(name, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write('target/release/${{ matrix.binary }}', '${{ matrix.binary }}')
              archive.write('LICENSE', 'LICENSE')
              for path in sorted(Path('docs').rglob('*')):
                  if path.is_file():
                      archive.write(path.as_posix(), path.as_posix())
      - name: Publish archive
        shell: bash
        run: |
          asset="ncell-cli-${TAG}-${{ matrix.platform }}.zip"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          fi
  rehash:
    # Point the package managers at the release this run just published.
    # Manual rebuild dispatches (source-ref) are excluded: their binaries do
    # not match the tag, so a human owns the manifests there.
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download release archives
        run: |
          mkdir -p .rehash
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ncell-cli-*.zip' --dir .rehash
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/${TAG}.tar.gz" -o .rehash/source.tar.gz
      - name: Prove the archives are this release
        run: |
          python -c "import zipfile; zipfile.ZipFile('.rehash/ncell-cli-${TAG}-linux-x86_64.zip').extract('ncell', '.rehash')"
          test "$(./.rehash/ncell --version)" = "ncell-cli ${TAG#v}"
      - name: Regenerate manifests
        run: python scripts/rehash-manifests.py --tag "$TAG" --assets-dir .rehash
      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add Formula bucket packaging
          if git diff --cached --quiet; then
            echo "Manifests already current; nothing to commit."
          else
            for attempt in 1 2 3; do
              git pull --rebase origin main && git commit -m "Point Homebrew, Scoop and WinGet manifests at $TAG" && git push origin HEAD:main && break
              [ "$attempt" = "3" ] && exit 1
              sleep 10
            done
          fi
      - name: Run Homebrew validation
        run: gh workflow run homebrew.yml --repo "$GITHUB_REPOSITORY"

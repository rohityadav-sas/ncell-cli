name: Build release binary
description: Install the pinned Rust toolchain, reuse its release cache, and build.
inputs:
  shared-key:
    description: Cache key shared by matching warm-up and release builds.
    required: true
  save-if:
    description: Whether this run may save the cache.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - name: Report installed toolchain
      shell: bash
      run: |
        rustup --version
        rustc --version
        rustup component list --installed
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
    - name: Build release binary
      shell: bash
      run: cargo build --release --locked
